name: Release

# A chaque push sur main : si la version du manifest n'a pas encore de tag,
# soumet la version au canal PUBLIC d'AMO (listed) — la publication effective
# attend la review Mozilla, AMO gere ensuite l'auto-update des utilisateurs —
# et publie la meme version sur le Chrome Web Store. Un tag vX.Y.Z sert de
# garde-fou anti-double-soumission.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: v
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} deja publie, rien a faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check AMO credentials
        if: steps.tag.outputs.exists == 'false'
        run: |
          if [ -z "${{ secrets.AMO_JWT_ISSUER }}" ] || [ -z "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "::error::Secrets AMO_JWT_ISSUER / AMO_JWT_SECRET manquants. Cle API : https://addons.mozilla.org/developers/addon/api/key/"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          node-version: 20

      - name: Submit to AMO (listed channel)
        if: steps.tag.outputs.exists == 'false'
        run: |
          npm install -g web-ext
          # --approval-timeout=0 : on soumet sans attendre la review Mozilla
          # (la publication arrive apres validation, cote AMO).
          web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --ignore-files README.md thumbnail-lab.zip "store/**"

      - name: Tag the released version
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" \
            --title "Thumbnail Lab $V" \
            --notes "Soumise a la review AMO (canal public) et publiee sur le Chrome Web Store. Installation et mises a jour via les fiches des stores."

  # Chrome Web Store : upload + publish de la nouvelle version via l'API.
  # La fiche doit avoir ete creee une premiere fois a la main sur le devconsole.
  # Skip silencieux tant que les secrets CWS_* ne sont pas configures.
  chrome-web-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: v
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CWS credentials
        id: creds
        if: steps.tag.outputs.exists == 'false'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_EXTENSION_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secrets CWS_* absents, publication Chrome ignoree."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.tag.outputs.exists == 'false' && steps.creds.outputs.configured == 'true'
        run: zip -r build.zip manifest.json content.js popup/ icons/
        # store/ et README exclus d'office : on ne zippe que ce qui est liste

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.exists == 'false' && steps.creds.outputs.configured == 'true'
        with:
          node-version: 20

      - name: Upload and publish to Chrome Web Store
        if: steps.tag.outputs.exists == 'false' && steps.creds.outputs.configured == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx chrome-webstore-upload-cli@3 upload --source build.zip --auto-publish
